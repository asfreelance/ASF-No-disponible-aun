<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>As Freelance · Muy pronto</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ac:#4f8fe0;--ac2:#2c5282;--g:#00ffc3;--ft:'Orbitron','Segoe UI',sans-serif;--fb:'Inter','Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#050607;color:#f2f5fa;font-family:var(--fb);-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{background:radial-gradient(ellipse at 72% 95%,#17386a 0%,#0b182b 34%,#050607 72%)}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:22px;right:22px;display:flex;justify-content:space-between;align-items:center;z-index:6}
.brand{display:flex;align-items:center;gap:10px;font:700 clamp(19px,2.1vw,27px) var(--ft);letter-spacing:.07em}
.brand img{width:clamp(46px,4.4vw,58px);height:auto;filter:drop-shadow(0 0 12px #4f8fe088)}
.brand b{color:var(--ac2)}
#snd{font-size:15px;color:#fff;border:1px solid #ffffff40;border-radius:999px;width:40px;height:40px;background:#0008;backdrop-filter:blur(6px);cursor:pointer;transition:.25s}
#snd:hover{background:#fff;color:#000}
.copy{position:fixed;left:clamp(24px,6vw,100px);top:50%;transform:translateY(-52%);z-index:3;max-width:min(680px,54vw)}
.tag{display:inline-flex;align-items:center;gap:10px;font:600 11px var(--ft);letter-spacing:.3em;color:var(--g);border:1px solid #00ffc355;border-radius:999px;padding:9px 16px;background:#00ffc30d}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 10px var(--g);animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.25}}
h1{font:900 clamp(32px,5.2vw,84px)/1.05 var(--ft);margin:22px 0 18px;background:linear-gradient(180deg,#fff 20%,#9db6dc);-webkit-background-clip:text;background-clip:text;color:transparent;animation:up 1s both}
.copy p{font-size:clamp(17px,1.9vw,26px);color:#a8bad6;animation:up 1s .15s both}
.cook{display:flex;gap:9px;margin-top:30px;animation:up 1s .3s both}
.cook span{width:11px;height:11px;border-radius:50%;background:var(--ac);animation:cd 1.3s ease-in-out infinite}
.cook span:nth-child(2){animation-delay:.18s}.cook span:nth-child(3){animation-delay:.36s}
@keyframes cd{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1.25);opacity:1;background:var(--g)}}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.floor{position:fixed;left:0;right:0;bottom:0;height:34vh;z-index:1;pointer-events:none;background:radial-gradient(ellipse 46% 100% at 74% 100%,#3b7be655,transparent 70%),linear-gradient(0deg,#0d1c33,transparent)}
.dog{position:fixed;bottom:0;left:55%;height:min(72vh,780px);width:auto;z-index:2;transform-origin:50% 100%;animation:br 4.6s ease-in-out infinite;filter:drop-shadow(0 0 44px #2a63c466);pointer-events:none}
@keyframes br{50%{transform:scale(1.012,1.02)}}
#hint{position:fixed;left:clamp(24px,6vw,100px);bottom:calc(env(safe-area-inset-bottom,0px) + 3.5vh);z-index:6;font:500 12px var(--fb);letter-spacing:.14em;color:#8fa6c8;text-transform:uppercase;pointer-events:none}
#hint b{color:var(--g);font-family:var(--ft)}
@media(max-width:760px){
 .copy{top:17vh;transform:none;max-width:none;right:24px}
 .dog{left:auto;right:-10vw;height:46vh}
 #hint{bottom:calc(env(safe-area-inset-bottom,0px) + 2vh);font-size:10px}
 .floor{background:radial-gradient(ellipse 80% 100% at 70% 100%,#3b7be655,transparent 70%),linear-gradient(0deg,#0d1c33,transparent)}
}
</style>
</head>

<script>
const R=Math.random,TAU=Math.PI*2,cv=document.getElementById('c'),g=cv.getContext('2d'),dog=document.getElementById('dog');
let W,H,DPR,mx=-999,my=-999,cnt=0,t=0,steamAcc=0;
const parts=[],sparks=[],rings=[],steam=[];
const COLS=[[110,170,255],[90,220,255],[180,200,255],[0,255,195],[255,214,140]];
// sprites: burbuja translúcida con borde y reflejo (como los fondos animados de celular)
const spr=COLS.map(c=>{const s=document.createElement('canvas');s.width=s.height=128;const x=s.getContext('2d'),gr=x.createRadialGradient(64,64,0,64,64,62);
gr.addColorStop(0,'rgba('+c+',0)');gr.addColorStop(.6,'rgba('+c+',.10)');gr.addColorStop(.86,'rgba('+c+',.5)');gr.addColorStop(1,'rgba('+c+',0)');x.fillStyle=gr;x.beginPath();x.arc(64,64,62,0,TAU);x.fill();
const h=x.createRadialGradient(46,44,0,46,44,22);h.addColorStop(0,'rgba(255,255,255,.8)');h.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=h;x.beginPath();x.arc(46,44,22,0,TAU);x.fill();return s});
function mk(init){const r=5+Math.pow(R(),2.2)*32;return{x:R()*W,y:init?R()*H:H*(.2+R()*.9),r,vx:(R()-.5)*16,vy:-(7+R()*24),ph:R()*TAU,wb:.25+R()*.8,a:.3+R()*.55,c:(R()*COLS.length)|0,ix:0,iy:0,alive:true,ap:init?1:0,rs:0}}
function size(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none';g.setTransform(DPR,0,0,DPR,0,0);
const n=Math.max(70,Math.min(200,Math.round(W*H/9500)));while(parts.length<n)parts.push(mk(true));parts.length=n}
addEventListener('resize',size);size();
// ---------- sonido ----------
let AC,muted=false;
function pop(r){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime,f=Math.max(220,720-r*9)+R()*90,o=AC.createOscillator(),a=AC.createGain();
o.type='sine';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*.28,n+.14);a.gain.setValueAtTime(.0001,n);a.gain.exponentialRampToValueAtTime(.2,n+.008);a.gain.exponentialRampToValueAtTime(.0001,n+.18);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+.2);
const b=AC.createBuffer(1,AC.sampleRate*.05,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(R()*2-1)*Math.pow(1-i/d.length,3);const s=AC.createBufferSource();s.buffer=b;const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=1800;const g2=AC.createGain();g2.gain.value=.12;s.connect(hp);hp.connect(g2);g2.connect(AC.destination);s.start(n)}catch(e){}}
document.getElementById('snd').onclick=e=>{e.stopPropagation();muted=!muted;e.currentTarget.textContent=muted?'🔇':'🔊'};
// ---------- explosión ----------
function boom(p){p.alive=false;p.rs=.9+R()*1.3;cnt++;document.getElementById('cnt').textContent=cnt;
const n=16+Math.round(p.r*.9);for(let i=0;i<n;i++){const a=R()*TAU,sp=110+R()*330*(.6+p.r/40);sparks.push({x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:0,L:.55+R()*.6,s:1.3+R()*3,c:p.c})}
rings.push({x:p.x,y:p.y,r:p.r,R:p.r*3.2+40,l:0,L:.55,c:p.c});
for(const q of parts){if(q===p||!q.alive)continue;const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d<230&&d>1){const f=(1-d/230)*300;q.ix+=dx/d*f;q.iy+=dy/d*f}}
pop(p.r)}
function hit(x,y,tol){let best=null,bd=1e9;for(const p of parts){if(!p.alive||p.ap<.6)continue;const d=Math.hypot(p.x-x,p.y-y);if(d<=p.r+tol&&d<bd){bd=d;best=p}}return best}
addEventListener('pointerdown',e=>{if(e.target.closest('#snd'))return;const p=hit(e.clientX,e.clientY,e.pointerType==='touch'?20:10);if(p)boom(p);else{rings.push({x:e.clientX,y:e.clientY,r:4,R:26,l:0,L:.35,c:0})}});
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;document.body.style.cursor=hit(mx,my,10)?'pointer':'default'});
addEventListener('pointerleave',()=>{mx=my=-999});
// ---------- bucle ----------
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;t+=dt;g.clearRect(0,0,W,H);g.globalCompositeOperation='lighter';
for(const p of parts){
 if(!p.alive){p.rs-=dt;if(p.rs<=0){Object.assign(p,mk(false),{x:R()*W,y:H+p.r*2})}continue}
 p.ap=Math.min(1,p.ap+dt*1.6);
 p.x+=(p.vx+Math.sin(t*p.wb+p.ph)*9)*dt+p.ix*dt;p.y+=p.vy*dt+p.iy*dt;const k=Math.exp(-2.4*dt);p.ix*=k;p.iy*=k;
 const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);if(d<110&&d>1){const f=(1-d/110)*90*dt;p.x+=dx/d*f;p.y+=dy/d*f}
 if(p.y<-p.r*2){p.y=H+p.r*2;p.x=R()*W}if(p.x<-p.r*2)p.x=W+p.r*2;if(p.x>W+p.r*2)p.x=-p.r*2;
 const e=1-Math.pow(1-p.ap,3),s=p.r*2*(.6+.4*e);g.globalAlpha=p.a*e;g.drawImage(spr[p.c],p.x-s/2,p.y-s/2,s,s)}
// vapor sobre el gorro
const rc=dog.getBoundingClientRect();steamAcc+=dt;if(rc.width>0&&steamAcc>.11){steamAcc=0;steam.push({x:rc.left+rc.width*(.5+R()*.28),y:rc.top+rc.height*.04,vx:(R()-.5)*14,vy:-(26+R()*30),r:12+R()*16,l:0,L:2.2+R()*1.2})}
for(let i=steam.length-1;i>=0;i--){const s=steam[i];s.l+=dt;if(s.l>s.L){steam.splice(i,1);continue}const k=s.l/s.L;s.x+=(s.vx+Math.sin(t*2+i)*8)*dt;s.y+=s.vy*dt;const z=s.r*(1+k*2.2)*2;g.globalAlpha=Math.sin(k*Math.PI)*.16;g.drawImage(spr[2],s.x-z/2,s.y-z/2,z,z)}
// destellos, anillos y chispas
for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.l+=dt;const k=r.l/r.L;if(k>=1){rings.splice(i,1);continue}const e=1-Math.pow(1-k,3),rad=r.r+(r.R-r.r)*e,c=COLS[r.c];
 g.globalAlpha=(1-k)*.9;g.strokeStyle='rgb('+c+')';g.lineWidth=2.4*(1-k)+.4;g.beginPath();g.arc(r.x,r.y,rad,0,TAU);g.stroke();
 const z=r.r*5*(1-k);g.globalAlpha=(1-k)*.7;g.drawImage(spr[r.c],r.x-z,r.y-z,z*2,z*2)}
for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.l+=dt;if(s.l>s.L){sparks.splice(i,1);continue}const k=s.l/s.L,f=Math.exp(-2.2*dt);s.vx*=f;s.vy=s.vy*f+90*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
 g.globalAlpha=1-k;g.fillStyle='rgb('+COLS[s.c]+')';g.beginPath();g.arc(s.x,s.y,s.s*(1-k*.6),0,TAU);g.fill();g.globalAlpha=(1-k)*.35;const z=s.s*7;g.drawImage(spr[s.c],s.x-z/2,s.y-z/2,z,z)}
g.globalAlpha=1;g.globalCompositeOperation='source-over'}
requestAnimationFrame(frame);
window.__p=parts;
